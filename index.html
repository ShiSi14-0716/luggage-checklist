<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行李清单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='7' width='18' height='13' rx='2' fill='%232383e2'/%3E%3Crect x='9' y='4' width='6' height='3.6' rx='1' fill='%232383e2'/%3E%3Crect x='10.4' y='11' width='3.2' height='4.4' rx='1' fill='%23191919'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#191919;
    --bg2:#202020;
    --bg3:#262626;
    --border:rgba(255,255,255,.09);
    --text:rgba(255,255,255,.81);
    --muted:rgba(255,255,255,.45);
    --faint:rgba(255,255,255,.28);
    --hover:rgba(255,255,255,.055);
    --accent:#2383e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:#3a3a3a #191919}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(35,131,226,.35)}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible{outline:1px solid var(--accent);outline-offset:1px;border-radius:3px}

  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;flex-direction:column;gap:8px;
    padding:10px 28px 8px;
    background:rgba(25,25,25,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .menu-row{
    display:flex;align-items:center;gap:8px;
  }
  .menubar{
    display:flex;align-items:center;gap:6px;
    overflow-x:auto;scrollbar-width:none;
    flex:1 1 auto;min-width:0;
  }
  .menubar::-webkit-scrollbar{display:none}
  .scene{
    font-size:13px;color:var(--muted);
    padding:4px 15px;border-radius:999px;
    border:1px solid var(--border);background:var(--bg2);
    white-space:nowrap;flex:0 0 auto;
    transition:color .15s,background .15s,border-color .15s;
  }
  .scene:hover{color:var(--text)}
  .scene.on{color:#fff;background:rgba(35,131,226,.18);border-color:rgba(35,131,226,.55)}
  .add-scene{
    flex:0 0 auto;
    font-size:12.5px;color:var(--accent);
    padding:4px 12px;border-radius:999px;
    border:1px dashed rgba(35,131,226,.55);background:rgba(35,131,226,.08);
    white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .add-scene:hover{background:rgba(35,131,226,.18);color:#fff}
  .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .save-hint{font-size:12px;color:var(--faint);margin-right:4px;white-space:nowrap}
  .tbtn{
    font-size:12.5px;color:var(--muted);
    padding:4px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--bg2);
    transition:color .15s,background .15s;
    white-space:nowrap;
  }
  .tbtn:hover{color:var(--text);background:var(--bg3)}
  .tbtn:disabled{opacity:.38;cursor:default}
  .tbtn:disabled:hover{color:var(--muted);background:var(--bg2)}
  .tbtn.danger{color:#ff7a7a;border-color:rgba(255,122,122,.45)}
  .tbtn.danger:hover{background:rgba(255,122,122,.12)}
  .tbtn.icon{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}

  /* ===== 主体 ===== */
  .wrap{
    max-width:820px;margin:0 auto;
    padding:30px 32px 90px;
  }
  .title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:6px}
  h1{font-size:28px;font-weight:700;letter-spacing:.2px;color:rgba(255,255,255,.9)}
  .progress{font-size:13px;color:var(--muted);white-space:nowrap;padding-bottom:4px}
  .pbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-bottom:24px;overflow:hidden}
  .pfill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .25s ease}

  /* ===== 层级卡片（莫兰迪色系：同级同色系不同色调，异级不同色系） ===== */
  .card{
    background:var(--cbg);
    border:1px solid var(--cborder);
    border-left:3px solid var(--cacc);
    border-radius:12px;
    padding:8px 12px 10px;
    margin:0 0 12px;
  }
  /* 第一层 · 冷色系（雾蓝 / 青灰 / 靛灰） */
  .card.lv1.c0{--cbg:#22303f;--cborder:rgba(143,168,201,.20);--cacc:#8fa8c9}
  .card.lv1.c1{--cbg:#1f3235;--cborder:rgba(134,179,171,.20);--cacc:#86b3ab}
  .card.lv1.c2{--cbg:#292e40;--cborder:rgba(155,163,204,.20);--cacc:#9ba3cc}
  .card.lv1.c3{--cbg:#2b3036;--cborder:rgba(168,176,187,.20);--cacc:#a8b0bb}
  .card.lv1.c4{--cbg:#1e3342;--cborder:rgba(132,174,205,.20);--cacc:#84aecd}
  .card.lv1.c5{--cbg:#25323b;--cborder:rgba(146,170,186,.20);--cacc:#92aaba}
  /* 第二层 · 暖灰绿系（橄榄 / 苔绿 / 鼠尾草） */
  .card.lv2.c0{--cbg:#2b3328;--cborder:rgba(166,187,145,.20);--cacc:#a6bb91}
  .card.lv2.c1{--cbg:#33342b;--cborder:rgba(191,192,142,.20);--cacc:#bfc08e}
  .card.lv2.c2{--cbg:#24312d;--cborder:rgba(143,181,155,.20);--cacc:#8fb59b}
  .card.lv2.c3{--cbg:#31352f;--cborder:rgba(174,184,166,.20);--cacc:#aeb8a6}
  .card.lv2.c4{--cbg:#2a3026;--cborder:rgba(159,176,138,.20);--cacc:#9fb08a}
  .card.lv2.c5{--cbg:#34322c;--cborder:rgba(184,176,150,.20);--cacc:#b8b096}
  /* 第三层 · 灰紫系（梅子 / 烟紫 / 干枯玫瑰） */
  .card.lv3.c0{--cbg:#332b38;--cborder:rgba(183,159,196,.20);--cacc:#b79fc4}
  .card.lv3.c1{--cbg:#3a2e36;--cborder:rgba(196,163,174,.20);--cacc:#c4a3ae}
  .card.lv3.c2{--cbg:#2f2a36;--cborder:rgba(169,160,192,.20);--cacc:#a9a0c0}
  .card.lv3.c3{--cbg:#382f32;--cborder:rgba(189,166,160,.20);--cacc:#bda6a0}
  .card.lv3.c4{--cbg:#342b33;--cborder:rgba(184,160,180,.20);--cacc:#b8a0b4}
  .card.lv3.c5{--cbg:#3b3033;--cborder:rgba(192,169,168,.20);--cacc:#c0a9a8}
  /* 第四层及以上 · 中性灰 */
  .card.lv4.c0{--cbg:#2b2b2b;--cborder:rgba(255,255,255,.09);--cacc:#b8b8b8}
  .card.lv4.c1{--cbg:#2e2e2e;--cborder:rgba(255,255,255,.09);--cacc:#c2c2c2}

  #tree{padding-left:2px}
  .node{position:relative}
  .card > .children{padding-left:0}
  .node:not(.card) > .children{padding-left:22px}
  .children{display:none}
  .children.open{display:block}

  .row{
    position:relative;
    display:flex;align-items:center;gap:6px;
    min-height:27px;
    padding:1px 6px 1px 30px;
    border-radius:4px;
    cursor:grab;
  }
  .row:hover{background:var(--hover)}
  .row.hdr{padding-left:28px;min-height:30px}
  .row.hdr .txt{font-weight:600;color:rgba(255,255,255,.92)}
  .card .row.hdr .chev{color:var(--cacc)}
  /* 层级字号：越深越小 */
  .lv1 .txt{font-size:17.5px}
  .lv2 .txt{font-size:16px}
  .lv3 .txt{font-size:14.5px}
  .lv4 .txt{font-size:13.5px}
  .lemoji{margin-right:4px;flex:0 0 auto}

  .dh{
    position:absolute;left:4px;top:50%;transform:translateY(-50%);
    width:20px;height:22px;line-height:1;border-radius:4px;
    color:var(--faint);opacity:0;transition:opacity .12s,color .12s,background .12s;
    display:flex;align-items:center;justify-content:center;
    cursor:grab;
  }
  .dh:hover{color:var(--muted);background:rgba(255,255,255,.1)}
  .row:hover .dh{opacity:1}

  .chev{
    width:16px;height:16px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.62);
    transition:transform .15s ease;
  }
  .chev svg{transition:transform .15s ease;transform:rotate(90deg)}
  .row.collapsed .chev svg{transform:rotate(0deg)}

  .cb{
    width:15px;height:15px;flex:0 0 auto;
    border:1.6px solid rgba(255,255,255,.55);
    border-radius:3.5px;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s,border-color .12s;
  }
  .cb:hover{border-color:var(--accent)}
  .cb.on{background:var(--accent);border-color:var(--accent)}
  .cb svg{opacity:0;transition:opacity .12s}
  .cb.on svg{opacity:1}

  .txt{
    flex:1 1 auto;min-width:2em;min-height:1.4em;
    outline:none;cursor:text;
    word-break:break-word;white-space:pre-wrap;
    border-radius:2px;
  }
  .txt:focus{background:rgba(255,255,255,.045)}
  .node.done .txt{color:rgba(255,255,255,.4);text-decoration:line-through}

  .hover-right{
    display:flex;gap:1px;flex:0 0 auto;
    opacity:0;transition:opacity .12s;
  }
  .row:hover .hover-right{opacity:1}
  .act{
    width:24px;height:24px;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;line-height:1;
  }
  .act:hover{background:rgba(255,255,255,.1);color:var(--text)}
  .act.del:hover{color:#ff7a7a}

  /* 拖拽调序 */
  .row.dragging{opacity:.35}
  .row.drop-before{box-shadow:0 -2px 0 var(--accent)}
  .row.drop-after{box-shadow:0 2px 0 var(--accent)}
  .row.drop-child{box-shadow:inset 2px 0 0 var(--accent)}

  .ghost{
    color:var(--faint);font-size:13.5px;
    padding:2px 6px 2px 28px;border-radius:4px;
    opacity:0;transition:opacity .12s,color .12s;
    cursor:pointer;user-select:none;
  }
  .ghost:hover{color:var(--accent);background:var(--hover)}
  .card:hover>.ghost{opacity:1}
  #tree:hover>.ghost{opacity:1}

  .hint{
    margin-top:26px;padding-top:16px;
    border-top:1px solid var(--border);
    color:var(--faint);font-size:12.5px;line-height:1.9;
  }
  .hint kbd{
    background:var(--bg2);border:1px solid var(--border);
    border-bottom-width:2px;border-radius:4px;
    padding:0 5px;font-family:inherit;font-size:11.5px;color:var(--muted);
  }

  /* ===== Toast ===== */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
    background:var(--bg3);border:1px solid var(--border);
    color:var(--text);font-size:13px;
    padding:7px 16px;border-radius:20px;
    opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;
    z-index:99;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 触屏 / 小屏适配 ===== */
  @media (pointer:coarse){
    .dh{opacity:.6}
    .hover-right{opacity:.6}
    .ghost{opacity:.55}
  }
  @media (max-width:640px){
    .topbar{padding:8px 12px 6px;row-gap:6px}
    .wrap{padding:24px 14px 70px}
    .save-hint{display:none}
    .card{padding:6px 10px 8px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="menu-row">
    <div class="menubar" id="menubar"></div>
    <button class="add-scene" id="btnAddScene" title="添加新清单">＋ 添加新清单</button>
  </div>
  <div class="top-actions">
    <span class="save-hint" id="saveHint">已自动保存</span>
    <button class="tbtn icon" id="btnUndo" title="撤销（Ctrl+Z）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-4"/></svg></button>
    <button class="tbtn icon" id="btnRedo" title="重做（Ctrl+Y）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h4"/></svg></button>
    <button class="tbtn" id="btnExpandAll" title="全部展开">展开</button>
    <button class="tbtn" id="btnCollapseAll" title="全部收起">收起</button>
    <button class="tbtn icon" id="btnUncheck" title="一键取消勾选"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 8 8 8M16 8l-8 8"/></svg></button>
    <button class="tbtn" id="btnUpdateDefault" title="手动上传当前内容到云端">更新</button>
    <button class="tbtn" id="btnReset" title="恢复当前场景默认清单">恢复</button>
  </div>
</div>

<div class="wrap">
  <div class="title-row">
    <h1>📜行李清单</h1>
    <span class="progress" id="progressText">已装 0 / 0</span>
  </div>
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
  <div id="tree"></div>
  <div class="hint">
    <div>点击文字即可编辑；<kbd>Enter</kbd> 在下方新建条目；<kbd>Tab</kbd> 缩进为子项、<kbd>Shift+Tab</kbd> 反缩进；空条目按 <kbd>Backspace</kbd> 删除；<kbd>Ctrl+Z</kbd> 撤销、<kbd>Ctrl+Y</kbd> 重做。</div>
    <div>按住条目左侧的六个点上下拖拽可调整顺序；悬停条目：← 退一级、→ 进一级、× 删除。所有修改自动保存在本机；点「更新」才会上传云端。</div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ================= 数据模型 ================= */
const KEY = "luggage_checklist_v2";
const LEGACY_KEY = "luggage_checklist_v1";
/* 云端同步数据块（extendsclass 匿名 JSON 存储，公开读写，ID 随机生成） */
const CLOUD_BIN = "https://json.extendsclass.com/bin/98292ec5fcd2";
let uidc = 0;
const nid = () => "n" + (++uidc) + "_" + Math.random().toString(36).slice(2, 7);
const clone = x => JSON.parse(JSON.stringify(x));
const check = (text, children) => ({ id: nid(), type: "check", text, checked: false, children: children || [] });
const toggle = (text, color, children) => ({ id: nid(), type: "toggle", text, color: color || "gray", expanded: true, children: children || [] });

/* ===== 场景模板（思维导图：出门清单） ===== */
function seedTravel() {
  return [
    toggle("⁉️出发当日拿（提前备好）", "red", [
      check("出发衣物（含袜子）"),
      check("牙刷（满电）"),
      check("手机充电线（塞背包-电子包）"),
      check("平板充电线（塞背包-电子包）"),
      check("扔垃圾"),
      check("快坏的水果"),
    ]),
    toggle("🧳行李箱（路上不拿出来）", "purple", [
      toggle("衣物包", "pink", [
        toggle("贴身衣物", "gray", [
          check("内衣"), check("内裤"), check("袜子"), check("帽巾"), check("浴巾"),
        ]),
        check("外穿衣物"), check("睡衣"), check("夏·防晒衣/冬·秋衣"), check("背包"), check("拖鞋"),
      ]),
      toggle("洗漱包", "blue", [
        check("牙刷"), check("卸妆膏"), check("洗面奶"), check("擦脸巾"),
        check("夏·保湿/冬·面霜"), check("凡士林"), check("梳子"), check("洗发水"),
        check("护发素"), check("护发精油"), check("卷发筒"), check("卷发袜"), check("沐浴露"),
      ]),
      toggle("化妆包", "pink", [
        check("美瞳"), check("防晒"), check("遮瑕(固&液)"), check("气垫"), check("双眼皮贴"),
        check("修容"), check("腮红"), check("口红"), check("眼影"), check("化妆刷"), check("小镜子"),
      ]),
      toggle("电脑包", "blue", [
        check("电脑"), check("充电线"), check("鼠标"), check("鼠标垫"), check("电脑支架"),
      ]),
      toggle("电子包", "green", [
        check("有线耳机"), check("手机充电线"),
        check("平板充电头", [check("平板充电线")]),
        check("usb充电头", [check("手表充电线"), check("typeC充电线")]),
      ]),
      toggle("药包（很少变动）", "orange", [
        check("偏头痛"), check("碘伏棉签"), check("创口贴"), check("布洛芬"), check("石脱蒙散"),
      ]),
    ]),
    toggle("🎒背包（路上会用到）", "yellow", [
      toggle("护理包", "orange", [
        check("口罩"), check("卫生巾"), check("酒精棉片"), check("发绳"), check("润唇膏"),
        check("夏·驱蚊液/冬·护手霜"), check("口喷"), check("风油精"), check("指甲剪"),
        check("眼镜盒"), check("衣物免洗剂"), check("偏头痛（小颗）"), check("布洛芬（小颗）"),
      ]),
      toggle("杂物", "green", [
        check("纸巾"), check("湿厕纸"), check("充电宝"), check("蓝牙耳机"), check("风扇"),
      ]),
    ]),
    toggle("🫴🏻外部", "blue", [
      check("钥匙"), check("外套"), check("手机（身份证）"),
      toggle("飞机安检版", "gray", [
        toggle("电脑包（选）", "blue", [
          check("电脑"), check("充电线"), check("鼠标"), check("鼠标垫"), check("电脑支架"),
        ]),
        check("雨伞"),
      ]),
    ]),
  ];
}
function seedOuting() {
  return [
    toggle("出门必备", "red", [
      check("手机"), check("钥匙(+指甲剪)"), check("耳机"), check("充电宝"),
    ]),
    toggle("出门plus", "orange", [
      check("雨伞"), check("水杯"),
    ]),
    toggle("护理小包", "pink", [
      check("纸巾"), check("头绳"), check("口罩"), check("消毒液"),
      check("口香糖"), check("润唇膏"), check("护手霜"), check("卫生巾"),
    ]),
    toggle("护理小包补充", "orange", [
      check("驱蚊液"), check("风油精"), check("创可贴"),
    ]),
    toggle("户外用品", "green", [
      check("坐垫"), check("小扇子"), check("零食"), check("垃圾袋"),
    ]),
    toggle("防晒用品", "yellow", [
      check("防晒衣"), check("防晒帽"), check("防晒口罩"),
    ]),
  ];
}
function seedWalk() {
  return [
    check("手机"), check("钥匙(+指甲剪)"), check("纸巾"), check("耳机"),
  ];
}
function seedShopping() {
  return [
    toggle("出门必备", "red", [
      check("手机"), check("钥匙(+指甲剪)"), check("耳机"), check("充电宝"),
    ]),
    toggle("出门plus", "orange", [
      check("雨伞"),
    ]),
    toggle("护理小包", "pink", [
      check("纸巾"), check("头绳"), check("口罩"), check("消毒液"),
      check("口香糖"), check("润唇膏"), check("护手霜"), check("卫生巾"),
    ]),
  ];
}
function seedOffice() {
  return [
    check("电脑"),
    toggle("出门必备", "red", [
      check("手机"), check("钥匙(+指甲剪)"), check("耳机"), check("充电宝"),
    ]),
    toggle("出门plus", "orange", [
      check("雨伞"), check("水杯"),
    ]),
    toggle("办公小包", "blue", [
      check("电脑充电器"), check("眼镜布"), check("圆珠笔"), check("草稿纸"),
    ]),
    toggle("护理小包", "pink", [
      check("纸巾"), check("头绳"), check("口罩"), check("消毒液"),
      check("口香糖"), check("润唇膏"), check("护手霜"), check("卫生巾"),
    ]),
  ];
}
/* 自定义清单（“添加新清单”创建，初始为空） */
function seedCustom() { return []; }
let SCENES = {
  travel:   { label: "旅行", seed: seedTravel },
  outing:   { label: "郊游", seed: seedOuting },
  walk:     { label: "散步", seed: seedWalk },
  shopping: { label: "逛街", seed: seedShopping },
  office:   { label: "办公", seed: seedOffice },
};

let activeScene = "travel";
let scenes = {};
let items = [];

/* 云端同步：拉取云端最新状态 */
async function fetchCloudState() {
  try {
    const res = await fetch(CLOUD_BIN + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return null;
    const d = await res.json();
    return (d && typeof d === "object") ? d : null;
  } catch (e) { return null; }
}
/* 本地加载（同步）：优先 v2 存档，其次旧版 v1，最后内置种子 */
function initLocal() {
  let v2 = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) v2 = JSON.parse(raw);
  } catch (e) { /* 忽略损坏的存档 */ }
  if (!v2 || typeof v2 !== "object" || !v2.scenes) {
    let legacy = null;
    try {
      const raw = localStorage.getItem(LEGACY_KEY);
      if (raw) legacy = JSON.parse(raw);
    } catch (e) { /* 忽略 */ }
    v2 = { scenes: {}, active: "travel" };
    v2.scenes.travel = (legacy && Array.isArray(legacy.items))
      ? { items: legacy.items, savedAt: legacy.savedAt || null }
      : { items: seedTravel(), savedAt: null };
  }
  for (const id of Object.keys(SCENES)) {
    if (!v2.scenes[id] || !Array.isArray(v2.scenes[id].items)) {
      v2.scenes[id] = { items: SCENES[id].seed(), savedAt: null };
    }
  }
  /* 恢复本地存档中的自定义清单 */
  for (const id of Object.keys(v2.scenes)) {
    if (!SCENES[id] && v2.scenes[id] && Array.isArray(v2.scenes[id].items)) {
      SCENES[id] = { label: v2.scenes[id].label || "清单", seed: seedCustom };
    }
  }
  if (!SCENES[v2.active]) v2.active = "travel";
  activeScene = v2.active;
  scenes = v2.scenes;
  items = scenes[activeScene].items;
}
/* 云端合并：每个场景取较新版本（本机未编辑过的种子场景不覆盖云端） */
function applyCloud(cloud) {
  let changed = false;
  if (cloud && cloud.scenes && typeof cloud.scenes === "object") {
    for (const [sid, s] of Object.entries(cloud.scenes)) {
      if (!s || !Array.isArray(s.items)) continue;
      /* 云端出现本地未知的自定义清单时也注册进来 */
      if (!SCENES[sid]) {
        SCENES[sid] = { label: s.label || "清单", seed: seedCustom };
      }
      const local = scenes[sid];
      const cTime = Date.parse(s.savedAt || s.updatedAt) || 0;
      const lTime = (local && local.savedAt) ? Date.parse(local.savedAt) : 0;
      if (cTime > lTime) {
        scenes[sid] = { items: clone(s.items), savedAt: s.savedAt || s.updatedAt || new Date().toISOString(), label: s.label };
        changed = true;
      }
    }
    if (SCENES[cloud.active] && cloud.active !== activeScene) {
      activeScene = cloud.active;
      changed = true;
    }
    cloudState = cloud;
  }
  return changed;
}
/* 是否有比云端更新的本地修改（决定是否提示「待上传」） */
function hasLocalEdits(cloud) {
  if (!cloud || !cloud.scenes) return false;
  for (const id of Object.keys(SCENES)) {
    const l = scenes[id];
    const c = cloud.scenes[id];
    const lT = (l && l.savedAt) ? Date.parse(l.savedAt) : 0;
    const cT = (c && (c.savedAt || c.updatedAt)) ? Date.parse(c.savedAt || c.updatedAt) : 0;
    if (lT > cT) return true;
  }
  return false;
}

/* ================= 工具函数 ================= */
function locate(arr, id) {
  for (let i = 0; i < arr.length; i++) {
    if (arr[i].id === id) return { arr, idx: i, parent: null };
    if (arr[i].children && arr[i].children.length) {
      const r = locate(arr[i].children, id);
      if (r) return { arr: r.arr, idx: r.idx, parent: arr[i] };
    }
  }
  return null;
}
function countChecks(nodes) {
  let total = 0, done = 0;
  (function walk(list) {
    for (const n of list) {
      if (n.type === "check") { total++; if (n.checked) done++; }
      if (n.children && n.children.length) walk(n.children);
    }
  })(nodes);
  return { total, done };
}
function setExpandedAll(nodes, v) {
  for (const n of nodes) {
    if (n.type === "toggle") n.expanded = v;
    if (n.children && n.children.length) setExpandedAll(n.children, v);
  }
}

/* ================= 撤销 / 重做 ================= */
const undoStack = [];
const redoStack = [];
const undoBtn = document.getElementById("btnUndo");
const redoBtn = document.getElementById("btnRedo");
function snapshot() {
  undoStack.push(clone(items));
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  updateBtnState();
}
function undo() {
  const prev = undoStack.pop();
  if (!prev) { toast("没有可撤销的操作"); return; }
  redoStack.push(clone(items));
  items = prev; scenes[activeScene] = { items: clone(items), savedAt: new Date().toISOString() };
  render(); updateBtnState(); toast("已撤销");
}
function redo() {
  const next = redoStack.pop();
  if (!next) { toast("没有可重做的操作"); return; }
  undoStack.push(clone(items));
  items = next; scenes[activeScene] = { items: clone(items), savedAt: new Date().toISOString() };
  render(); updateBtnState(); toast("已重做");
}
function updateBtnState() {
  undoBtn.disabled = undoStack.length === 0;
  redoBtn.disabled = redoStack.length === 0;
}

const SVG_CHECK = '<svg width="10" height="10" viewBox="0 0 12 12"><path d="M2.5 6.2 L5 8.6 L9.6 3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* 母层级 emoji：已知关键词优先，未知按层级色板兜底；文本已以 emoji 开头则不重复 */
const EMOJI_RULES = [
  ["贴身", "🧦"], ["洗漱", "🧴"], ["化妆", "💄"], ["电脑", "💻"], ["电子", "🔌"],
  ["药", "💊"], ["护理小包", "🧻"], ["护理", "🩹"], ["衣物", "👕"], ["杂物", "🧺"],
  ["飞机", "✈️"], ["出门必备", "🔑"], ["出门plus", "➕"], ["户外用品", "🏕️"],
  ["防晒用品", "🧢"], ["办公小包", "✏️"],
];
const LEVEL_EMOJI = [
  ["🧳", "🎒", "📦", "🧰", "📁", "🗂️"],
  ["📎", "🧷", "📌", "🖇️", "🔹", "🔸"],
  ["🔹", "🔸"],
];
function isEmojiStart(s) {
  const cp = s.codePointAt(0);
  return (cp >= 0x1F000 && cp <= 0x1FAFF) || (cp >= 0x2600 && cp <= 0x27BF) || (cp >= 0x2000 && cp <= 0x206F);
}
function emojiFor(n, depth, idx) {
  const t = (n.text || "").trim();
  if (t && isEmojiStart(t)) return "";
  for (const [kw, em] of EMOJI_RULES) if (t.includes(kw)) return em;
  const pal = LEVEL_EMOJI[Math.min(depth, 2)];
  return pal[idx % pal.length];
}

function renderNode(n, depth, idx) {
  const node = el("div", "node");
  node.dataset.id = n.id;
  if (n.type === "check" && n.checked) node.classList.add("done");

  const row = el("div", "row");
  row.dataset.id = n.id;
  row.dataset.type = n.type;
  row.draggable = true;

  if (n.type === "toggle") {
    node.classList.add("card");
    node.classList.add("c" + (idx % 6));
    row.classList.add("hdr");
    if (!n.expanded) row.classList.add("collapsed");
  }
  node.classList.add("lv" + Math.min(depth + 1, 4));

  const dh = el("button", "act dh");
  dh.title = "拖拽调整顺序";
  dh.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>';

  if (n.type === "toggle") {
    const ch = el("button", "chev");
    ch.title = n.expanded ? "收起" : "展开";
    ch.innerHTML = SVG_CHEV;
    row.appendChild(ch);
  } else {
    const cb = el("button", "cb" + (n.checked ? " on" : ""));
    cb.title = "勾选 / 取消";
    cb.innerHTML = SVG_CHECK;
    row.appendChild(cb);
  }
  const txt = el("div", "txt");
  txt.contentEditable = "true";
  txt.spellcheck = false;
  txt.textContent = n.text || "";
  if (n.type === "toggle") {
    const em = emojiFor(n, depth, idx);
    if (em) {
      const es = el("span", "lemoji");
      es.textContent = em;
      row.appendChild(es);
    }
  }
  row.appendChild(txt);

  const hr = el("div", "hover-right");
  const mk = (cls, t, html) => { const b = el("button", "act " + cls); b.title = t; b.innerHTML = html; return b; };
  hr.appendChild(mk("outdent", "退一级（Shift+Tab）", "←"));
  hr.appendChild(mk("indent", "进一级（Tab）", "→"));
  hr.appendChild(mk("del", "删除", "×"));
  row.appendChild(hr);

  row.insertBefore(dh, row.firstChild);
  node.appendChild(row);

  const kids = el("div", "children");
  if (n.children && n.children.length) {
    const childDepth = n.type === "toggle" ? depth + 1 : depth;
    n.children.forEach((c, i) => kids.appendChild(renderNode(c, childDepth, i)));
    if (n.type === "toggle" ? n.expanded : true) kids.classList.add("open");
  }
  node.appendChild(kids);

  if (n.type === "toggle" || (n.children && n.children.length)) {
    const ghost = el("div", "ghost");
    ghost.dataset.pid = n.id;
    ghost.innerHTML = "＋ 在此组添加";
    node.appendChild(ghost);
  }
  return node;
}

function render() {
  tree.innerHTML = "";
  items.forEach((n, i) => tree.appendChild(renderNode(n, 0, i)));
  const ghost = el("div", "ghost");
  ghost.dataset.pid = "root";
  ghost.innerHTML = "＋ 添加条目";
  tree.appendChild(ghost);
  updateProgress();
  save();
}

function updateProgress() {
  const { total, done } = countChecks(items);
  document.getElementById("progressText").textContent = "已装 " + done + " / " + total;
  document.getElementById("pfill").style.width = total ? (done / total * 100).toFixed(1) + "%" : "0%";
}

/* ================= 持久化 + 云端同步 ================= */
let saveTimer = null;
function saveNow() {
  clearTimeout(saveTimer);
  scenes[activeScene] = { items: clone(items), savedAt: new Date().toISOString(), label: SCENES[activeScene].label };
  try { localStorage.setItem(KEY, JSON.stringify({ scenes, active: activeScene })); } catch (e) {}
  const h = document.getElementById("saveHint");
  if (h) { h.textContent = "已保存·待上传"; h.style.color = "#e8b84b"; }
}
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 250);
}

let cloudState = null;      // 最近一次成功拉取 / 写入的云端状态
let syncChain = Promise.resolve();
function setSyncStatus(ok) {
  const h = document.getElementById("saveHint");
  if (!h) return;
  h.textContent = ok ? "已同步" : "云端同步失败";
  h.style.color = ok ? "" : "#ff7a7a";
}
/* 推送前合并：本机未编辑过的场景保留云端版本，避免覆盖其他设备的修改 */
function mergeForPush(cloud) {
  const now = new Date().toISOString();
  const out = { scenes: {}, active: activeScene, updatedAt: now };
  for (const id of Object.keys(SCENES)) {
    const local = scenes[id] || { items: [] };
    const cloudS = (cloud && cloud.scenes) ? cloud.scenes[id] : null;
    const lT = (local.savedAt) ? Date.parse(local.savedAt) : 0;
    const cT = (cloudS && (cloudS.savedAt || cloudS.updatedAt)) ? Date.parse(cloudS.savedAt || cloudS.updatedAt) : 0;
    if (cloudS && Array.isArray(cloudS.items) && cT > lT) {
      out.scenes[id] = { items: clone(cloudS.items), savedAt: cloudS.savedAt || cloudS.updatedAt || now, label: cloudS.label || local.label };
    } else {
      out.scenes[id] = { items: clone(local.items), savedAt: local.savedAt || now, label: local.label };
    }
  }
  return out;
}
async function doPush() {
  let cloud = cloudState;
  let fetched = false;
  try {
    const res = await fetch(CLOUD_BIN + "?v=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const d = await res.json();
      if (d && typeof d === "object") { cloud = d; fetched = true; }
    }
  } catch (e) { /* 拉取失败时用缓存状态 */ }
  /* 从未成功拉取过云端就跳过写入，防止覆盖云端已有数据 */
  if (!cloudState && !fetched) { setSyncStatus(false); return false; }
  const payload = mergeForPush(cloud);
  try {
    if (JSON.stringify(payload).length > 90000) {
      setSyncStatus(false);
      toast("云端同步失败：内容超过 100KB 上限");
      return false;
    }
    const res = await fetch(CLOUD_BIN, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const ok = res.ok || res.status === 200;
    if (ok) cloudState = payload;
    setSyncStatus(ok);
    return ok;
  } catch (e) {
    setSyncStatus(false);
    return false;
  }
}
function pushCloudState() {
  syncChain = syncChain.then(doPush);
  return syncChain;
}

/* ================= 操作 ================= */
function focusText(id) {
  const t = tree.querySelector('.row[data-id="' + id + '"] .txt');
  if (!t) return;
  t.focus();
  const r = document.createRange();
  r.selectNodeContents(t);
  r.collapse(false);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function addNodeAfter(id) {
  const loc = locate(items, id);
  if (!loc) return;
  snapshot();
  const node = check("");
  loc.arr.splice(loc.idx + 1, 0, node);
  render();
  focusText(node.id);
}
function addChild(pid) {
  snapshot();
  let node;
  if (pid === "root") {
    node = check("");
    items.push(node);
  } else {
    const loc = locate(items, pid);
    if (!loc) return;
    loc.arr[loc.idx].children.push(node = check(""));
  }
  render();
  focusText(node.id);
}
function delNode(id) {
  const loc = locate(items, id);
  if (!loc) return;
  snapshot();
  const node = loc.arr[loc.idx];
  const kids = (node.children || []).slice();
  loc.arr.splice(loc.idx, 1);
  if (kids.length) loc.arr.splice.apply(loc.arr, [loc.idx, 0].concat(kids));
  render();
}
function indent(id) {
  const loc = locate(items, id);
  if (!loc || loc.idx === 0) return;
  snapshot();
  const node = loc.arr.splice(loc.idx, 1)[0];
  const prev = loc.arr[loc.idx - 1];
  if (!prev.children) prev.children = [];
  prev.children.push(node);
  render();
  focusText(id);
}
function outdent(id) {
  const loc = locate(items, id);
  if (!loc || !loc.parent) return;
  snapshot();
  const node = loc.arr.splice(loc.idx, 1)[0];
  const ploc = locate(items, loc.parent.id);
  ploc.arr.splice(ploc.idx + 1, 0, node);
  render();
  focusText(id);
}
function toggleExpand(id) {
  const loc = locate(items, id);
  if (!loc) return;
  const n = loc.arr[loc.idx];
  if (n.type !== "toggle") return;
  snapshot();
  n.expanded = !n.expanded;
  render();
}
function toggleCheck(id) {
  const loc = locate(items, id);
  if (!loc) return;
  const n = loc.arr[loc.idx];
  if (n.type !== "check") return;
  snapshot();
  n.checked = !n.checked;
  render();
}

/* ================= 拖拽调序 ================= */
let dragId = null;
function clearDropIndicators() {
  tree.querySelectorAll(".row.drop-before,.row.drop-after,.row.drop-child").forEach(r => {
    r.classList.remove("drop-before", "drop-after", "drop-child");
  });
}
tree.addEventListener("dragstart", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  dragId = row.dataset.id;
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragId); } catch (err) {}
  row.classList.add("dragging");
});
tree.addEventListener("dragend", () => {
  dragId = null;
  tree.querySelectorAll(".row.dragging").forEach(r => r.classList.remove("dragging"));
  clearDropIndicators();
});
tree.addEventListener("dragover", e => {
  const row = e.target.closest(".row");
  if (!row || row.dataset.id === dragId) return;
  e.preventDefault();
  clearDropIndicators();
  const rect = row.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  const asChild = row.dataset.type === "toggle" && (e.clientX - rect.left) < rect.width * 0.25;
  row.classList.add(before ? "drop-before" : "drop-after");
  if (asChild) row.classList.add("drop-child");
});
tree.addEventListener("drop", e => {
  e.preventDefault();
  const row = e.target.closest(".row");
  if (!row || !dragId || row.dataset.id === dragId) return;
  const loc = locate(items, dragId);
  if (!loc) return;
  const rect = row.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  const asChild = row.dataset.type === "toggle" && (e.clientX - rect.left) < rect.width * 0.25;
  snapshot();
  const node = loc.arr.splice(loc.idx, 1)[0];
  const tloc = locate(items, row.dataset.id);
  if (asChild) {
    tloc.arr[tloc.idx].children.push(node);
  } else {
    tloc.arr.splice(tloc.idx + (before ? 0 : 1), 0, node);
  }
  clearDropIndicators();
  render();
  const moved = tree.querySelector('.row[data-id="' + node.id + '"]');
  if (moved) moved.scrollIntoView({ block: "nearest" });
});

/* ================= 事件 ================= */
document.addEventListener("click", e => {
  const ghost = e.target.closest(".ghost");
  if (ghost) { addChild(ghost.dataset.pid); return; }
  const act = e.target.closest(".act");
  if (act) {
    const id = act.closest(".row").dataset.id;
    if (act.classList.contains("outdent")) outdent(id);
    else if (act.classList.contains("indent")) indent(id);
    else if (act.classList.contains("del")) delNode(id);
    return;
  }
  const chev = e.target.closest(".chev");
  if (chev) { toggleExpand(chev.closest(".row").dataset.id); return; }
  const cb = e.target.closest(".cb");
  if (cb) { toggleCheck(cb.closest(".row").dataset.id); return; }
  const row = e.target.closest(".row");
  if (row && row.dataset.type === "toggle" && !e.target.closest(".txt")) {
    toggleExpand(row.dataset.id);
  }
});

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (k === "z" || k === "y")) {
    e.preventDefault();
    if (k === "z") { e.shiftKey ? redo() : undo(); }
    else { redo(); }
    return;
  }
  const t = e.target && e.target.classList && e.target.classList.contains("txt") ? e.target : null;
  if (!t) return;
  const id = t.closest(".row").dataset.id;
  if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
    e.preventDefault(); addNodeAfter(id); return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    if (e.shiftKey) outdent(id); else indent(id);
    return;
  }
  if (e.key === "Backspace" && t.textContent === "") {
    e.preventDefault(); delNode(id);
  }
});

document.addEventListener("focusin", e => {
  if (e.target && e.target.classList && e.target.classList.contains("txt")) snapshot();
});

document.addEventListener("input", e => {
  if (e.target && e.target.classList && e.target.classList.contains("txt")) {
    const id = e.target.closest(".row").dataset.id;
    const loc = locate(items, id);
    if (loc) { loc.arr[loc.idx].text = e.target.textContent; save(); }
  }
});

document.addEventListener("blur", e => {
  const t = e.target;
  if (t && t.classList && t.classList.contains("txt")) {
    const id = t.closest(".row").dataset.id;
    const loc = locate(items, id);
    if (!loc) return;
    const n = loc.arr[loc.idx];
    const txt = (t.textContent || "").trim();
    if (txt === "" && (!n.children || !n.children.length)) {
      delNode(id);
    } else if (txt !== n.text) {
      n.text = txt;
      t.textContent = txt;
      save();
    }
  }
}, true);

/* ================= 顶栏 ================= */
undoBtn.addEventListener("click", undo);
redoBtn.addEventListener("click", redo);
document.getElementById("btnExpandAll").addEventListener("click", () => { snapshot(); setExpandedAll(items, true); render(); });
document.getElementById("btnCollapseAll").addEventListener("click", () => { snapshot(); setExpandedAll(items, false); render(); });
/* 一键取消勾选（仅当前场景） */
document.getElementById("btnUncheck").addEventListener("click", () => {
  let any = false;
  (function walk(list) {
    for (const n of list) {
      if (n.type === "check" && n.checked) any = true;
      if (n.children && n.children.length) walk(n.children);
    }
  })(items);
  if (!any) { toast("没有已勾选的条目"); return; }
  snapshot();
  (function walk(list) {
    for (const n of list) {
      if (n.type === "check") n.checked = false;
      if (n.children && n.children.length) walk(n.children);
    }
  })(items);
  render();
  toast("已取消全部勾选");
});

/* 更新：手动上传当前内容到云端（只有点这个按钮才会上传） */
document.getElementById("btnUpdateDefault").addEventListener("click", async () => {
  saveNow();
  const h = document.getElementById("saveHint");
  if (h) { h.textContent = "上传中…"; h.style.color = ""; }
  const ok = await pushCloudState();
  toast(ok ? "已上传到云端" : "上传失败，请检查网络");
});

/* 恢复默认清单：两次点击确认，防止误触；有云端版本则恢复云端，否则恢复内置默认 */
const resetBtn = document.getElementById("btnReset");
let resetArmed = false, resetTimer = null;
resetBtn.addEventListener("click", async () => {
  if (!resetArmed) {
    resetArmed = true;
    resetBtn.textContent = "确认？";
    resetBtn.classList.add("danger");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(disarmReset, 3000);
    return;
  }
  disarmReset();
  let seed, fromCloud = false;
  const cloudS = (cloudState && cloudState.scenes) ? cloudState.scenes[activeScene] : null;
  if (cloudS && Array.isArray(cloudS.items)) { seed = clone(cloudS.items); fromCloud = true; }
  else { seed = SCENES[activeScene].seed(); }
  snapshot();
  items = seed;
  scenes[activeScene] = { items: clone(items), savedAt: new Date().toISOString(), label: SCENES[activeScene].label };
  render();
  toast(fromCloud ? "已恢复云端版本" : "已恢复内置默认");
});
function disarmReset() {
  resetArmed = false;
  clearTimeout(resetTimer);
  resetBtn.textContent = "恢复";
  resetBtn.classList.remove("danger");
}

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

(async function init() {
  initLocal();
  buildMenu();
  render();
  updateBtnState();
  /* 后台拉取云端合并（不阻塞首屏渲染） */
  const cloud = await fetchCloudState();
  if (applyCloud(cloud)) {
    try { localStorage.setItem(KEY, JSON.stringify({ scenes, active: activeScene })); } catch (e) {}
    buildMenu();
    items = scenes[activeScene].items;
    render();
    updateBtnState();
    toast("已同步云端最新内容");
  }
  if (cloud && cloud.scenes) {
    const h = document.getElementById("saveHint");
    if (h) {
      const dirty = hasLocalEdits(cloud);
      h.textContent = dirty ? "已保存·待上传" : "已同步";
      h.style.color = dirty ? "#e8b84b" : "";
    }
  }
})();
</script>
</body>
</html>
